[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparxo"
version = "1.0.0"
description = "SPARX-O: Calendar-Phase State Space optical SITS segmentation"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "PyYAML>=6", "rasterio>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
panoptic = ["torchvision>=0.17", "timm>=0.9,<1.1", "yacs>=0.1.8", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3", "einops>=0.7", "fvcore>=0.1.5", "tensorboard>=2.14", "matplotlib>=3.7", "tqdm>=4.65", "opencv-python>=4.8"]
mtlcc = ["tfrecord>=1.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
